  <script>
    (function () {
      var soundBtn = document.getElementById("sound-toggle");
      var onIcon = document.getElementById("sound-on-icon");
      var offIcon = document.getElementById("sound-off-icon");
      if (soundBtn && onIcon && offIcon) {
        soundBtn.addEventListener("click", function () {
          var muted = soundBtn.getAttribute("aria-pressed") === "true";
          soundBtn.setAttribute("aria-pressed", muted ? "false" : "true");
          onIcon.classList.toggle("hidden", muted);
          offIcon.classList.toggle("hidden", !muted);
        });
      }

      var fsBtn = document.getElementById("fullscreen-toggle");
      if (fsBtn) {
        fsBtn.addEventListener("click", function () {
          try {
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            } else if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          } catch (e) {}
        });
      }
    })();
  </script>
